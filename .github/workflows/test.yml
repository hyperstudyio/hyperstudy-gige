name: Unit Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  framepipelinekit:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift version
        run: swift --version
      - name: Run FramePipelineKit tests
        working-directory: FramePipelineKit
        run: swift test
